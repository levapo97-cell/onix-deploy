# NATS de DESARROLLO para OnixGuard.
# JetStream activo (streams durables). En dev NO hay TLS ni auth: la red de compose es interna.
#
# En PRODUCCIÓN (VPS) tu PC se conecta desde casa por conexión SALIENTE con TLS + token de máquina
# (ver README de onix-deploy, sección "Producción y seguridad"). Esta config es solo para local.

# Puerto de clientes
port: 4222

# Puerto de monitoreo/health (http://localhost:8222/healthz, /varz, /jsz)
http_port: 8222

# Almacenamiento durable de JetStream
jetstream {
  store_dir: "/data"
  max_memory_store: 268435456   # 256 MB
  max_file_store: 2147483648    # 2 GB
}

# Los streams (ONIX_RAW, ONIX_NORM, ONIX_CLEAN, ONIX_CTRL) se crean desde los servicios
# a partir de Fase 1. En Fase 0 basta con que JetStream esté disponible.
