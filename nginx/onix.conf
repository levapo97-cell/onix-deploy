# nginx para onix.devtoolsdk.com (VPS, detrás de Cloudflare).
# TLS lo termina Cloudflare (o certbot aquí). Rutea el subdominio a los servicios en Docker.
#
# Rutas:
#   /            → frontend (contenedor onixguard-frontend, :3000→80)
#   /api, /auth  → onix-gateway (:8080)
#   /ws          → onix-gateway WebSocket (:8080) — requiere upgrade + timeout largo
#   /mcp         → onix-orchestrator MCP (:8084) — streaming SSE, timeout largo (sobrevivir pausas)
#
# ⚠️ Cloudflare corta conexiones idle (~100s): para /ws y /mcp sube los timeouts aquí y, en
#    Cloudflare, usa una regla que no bufferee esas rutas. El MCP bloqueante depende de esto.

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name onix.devtoolsdk.com;

    # Frontend
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # REST + auth del gateway
    location ~ ^/(api|auth)/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket del gateway (actividad en vivo)
    location /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;   # keepalive largo
        proxy_send_timeout 3600s;
    }

    # MCP del orchestrator (streaming; llamadas bloqueantes reportar/pedir)
    location /mcp {
        proxy_pass http://127.0.0.1:8084;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_buffering off;        # SSE: no bufferear
        proxy_read_timeout 3600s;   # el MCP bloqueante puede esperar al jefe
        proxy_send_timeout 3600s;
    }
}
