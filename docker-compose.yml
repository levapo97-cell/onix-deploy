# OnixGuard — docker-compose de DESARROLLO.
# Orquesta: NATS/JetStream + servicio core (onix-ingestor, Fase 0) + frontend OnixGuard.
# PostgreSQL es EXTERNO (lo montó el jefe en el VPS): NO va aquí, entra por DATABASE_URL.
# onix-hook tampoco va aquí: se compila e instala en tu PC.
#
# Supone los repos clonados como HERMANOS (polyrepo):
#   Onix/
#     onix-deploy/   (este repo)
#     onix-ingestor/ onix-db/ OnixGuard/ ...
#
# Uso: `make dev` (o `docker compose up --build`). Migraciones: `make migrate` (perfil aparte).

name: onixguard

services:
  # ─────────────── Bus de eventos ───────────────
  nats:
    image: nats:2.10-alpine
    command: ["-c", "/etc/nats/nats.conf"]
    ports:
      - "4222:4222"   # clientes
      - "8222:8222"   # monitoreo/health HTTP
    volumes:
      - ./nats/nats.conf:/etc/nats/nats.conf:ro
      - nats_data:/data
    healthcheck:
      # endpoint de salud de JetStream expuesto en el puerto de monitoreo
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ─────────────── Ingestor: raw → norm (valida/normaliza) ───────────────
  ingestor:
    build:
      context: ../onix-ingestor
      args:
        VERSION: dev
    environment:
      PORT: "8081"
      NATS_URL: "nats://nats:4222"
    ports:
      - "8081:8081"
    depends_on:
      nats:
        condition: service_healthy
    restart: unless-stopped

  # ─────────────── Guard (Rust): norm → clean (redacta + detecta) ───────────────
  guard:
    build:
      context: ../onix-guard
    environment:
      PORT: "8083"
      NATS_URL: "nats://nats:4222"
    ports:
      - "8083:8083"
    depends_on:
      nats:
        condition: service_healthy
    restart: unless-stopped

  # ─────────────── Recorder: clean → Postgres (persiste) ───────────────
  recorder:
    build:
      context: ../onix-recorder
      args:
        VERSION: dev
    environment:
      PORT: "8082"
      NATS_URL: "nats://nats:4222"
      DATABASE_URL: "${DATABASE_URL:-}"
    ports:
      - "8082:8082"
    depends_on:
      nats:
        condition: service_healthy
    restart: unless-stopped

  # ─────────────── Orchestrator: MCP + pausa/reanuda + 12 etapas ───────────────
  orchestrator:
    build:
      context: ../onix-orchestrator
      args:
        VERSION: dev
    environment:
      PORT: "8085"       # HTTP de control (gateway → orchestrator) + salud
      MCP_PORT: "8084"   # servidor MCP (agentes)
      NATS_URL: "nats://nats:4222"
      DATABASE_URL: "${DATABASE_URL:-}"
      REPORT_TIMEOUT_MIN: "15"
    ports:
      - "8084:8084"
      - "8085:8085"
    depends_on:
      nats:
        condition: service_healthy
    restart: unless-stopped

  # ─────────────── Gateway (edge: REST + WebSocket) ───────────────
  gateway:
    build:
      context: ../onix-gateway
      args:
        VERSION: dev
    environment:
      PORT: "8080"
      NATS_URL: "nats://nats:4222"
      DATABASE_URL: "${DATABASE_URL:-}"
      ORCHESTRATOR_URL: "http://orchestrator:8085"
    ports:
      - "8080:8080"
    depends_on:
      nats:
        condition: service_healthy
    restart: unless-stopped

  # ─────────────── Frontend ───────────────
  frontend:
    build:
      context: ../OnixGuard
    ports:
      - "3000:80"
    depends_on:
      - gateway
    restart: unless-stopped

  # ─────────────── Migraciones (perfil aparte, no bloquea el smoke test) ───────────────
  # Corre con: `make migrate` → docker compose --profile migrate run --rm migrate
  migrate:
    image: migrate/migrate:v4.17.1
    profiles: ["migrate"]
    volumes:
      - ../onix-db/migrations:/migrations:ro
    # host.docker.internal permite alcanzar un Postgres del host desde el contenedor (mac/win).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      ["-path=/migrations", "-database", "${DATABASE_URL}", "up"]

volumes:
  nats_data:
